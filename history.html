<!DOCTYPE html> <html lang="id">
<head>
<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Stok</title>
<link rel="stylesheet" href="style.css">
<style>
.top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.filter-card{ background:white; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 2px10px rgba(0,0,0,.08); }
.filter-row{ display:flex; gap:10px; flex-wrap:wrap; }
.report-card{ background:white; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 2px10px rgba(0,0,0,.08); }
.report-header{ display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #eee; }
.summary{ display:flex; gap:20px; margin-top:10px; font-weight:bold; }
table{ width:100%; border-collapse:collapse; }
th,td{ padding:10px; border:1px solid #ddd; }
th{ background:#f5f5f5; }
.good{ color:green; font-weight:bold; }
.bad{ color:red; font-weight:bold; }
@media(max-width:768px){
.report-header{ flex-direction:column; gap:8px; }
.summary{ flex-direction:column; gap:5px; }
}

</style>
</head>
<body>
<div class="container">
<div class="top-bar">
<h2>📊 Riwayat Laporan</h2>
<a href="index.html" class="btn"> Dashboard </a>
</div>
<div class="filter-card">
<h3>Filter Tanggal</h3>
<br>
<div class="filter-row">
<input type="date" id="tanggalFilter">
<button class="btn" onclick="loadHistory()">
Cari
</button>
<button class="btn-success" onclick="loadToday()">
Hari Ini
</button>
</div>
</div>
<div id="reportContainer">
</div>

</div>
<script src="config.js"></script>
<script>
document.addEventListener( "DOMContentLoaded", ()=>{ loadToday(); } );
function formatTanggal(date){
const d = new Date(date);
return d.toLocaleDateString( "id-ID", { day:"2-digit", month:"long", year:"numeric" } );
}
function loadToday(){
const today = new Date() .toISOString() .split("T")[0];
document.getElementById( "tanggalFilter" ).value = today;
loadHistory();
}
async function loadHistory(){
const tanggal = document.getElementById( "tanggalFilter" ).value;
if(!tanggal){
alert( "Pilih tanggal terlebih dahulu" );
return;
}
try{
const response = await fetch( SCRIPT_URL + "?action=getHistory" );
const data = await response.json();
const filtered = data.filter(item=>{

const rowDate = String(item.tanggal) .substring(0,10);
return rowDate === tanggal;
});
renderClosing(filtered,tanggal);
} catch(error){
console.log(error);
alert( "Gagal memuat data" );
}
}
function renderClosing(data,tanggal){
const container = document.getElementById( "reportContainer" );
container.innerHTML = "";
if(data.length === 0){
container.innerHTML =
` <div class="report-card">
<h3>Tidak ada data pada tanggal ini</h3>
</div> `;
return;
}
let totalQty = 0;
data.forEach(item=>{
totalQty += parseInt(item.qty) || 0;
});

let rows = "";
data.forEach(item=>{
rows +=
` <tr>
<td>${item.barang}</td>
<td>${item.qty}</td>
<td>${item.petugas}</td>
</tr> `;
});
container.innerHTML =
` <div class="report-card">
<div class="report-header">
<div>
<h3> 📅 ${formatTanggal(tanggal)} </h3>
</div>
<div class="summary">
<span> 📦 Total Barang : ${data.length} </span>
<span> 🔢 Total Qty : ${totalQty} </span>
</div>
</div>
<table>
<thead>
<tr>

<th>Barang</th> <th>Qty</th> <th>Petugas</th>
</tr>
</thead>
<tbody>
${rows}
</tbody>
</table>
</div> `;
}
</script>
</body> </html>
